# Fly.io deployment.
# Fly supports volumes, which is what SQLite needs. Note the free allowance
# was withdrawn in 2026 — this is a paid deploy, roughly the cost of a
# shared-cpu-1x machine plus a 1GB volume.
#
#   fly launch --no-deploy
#   fly volume create dining_data --size 1 --region <region>
#   fly secrets set SESSION_SECRET=... STAFF_SESSION_SECRET=...
#   fly deploy

app = "in-room-dining"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/dining.db"
  HOTEL_TZ = "Europe/Moscow"
  DEMO_MODE = "on"
  DEMO_RESET = "on"
  DEMO_RESET_HOUR = "4"

# A single machine, because SQLite is one file on one disk. Scaling this to
# two machines would give each its own database and split the data in half.
[[mounts]]
  source = "dining_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
