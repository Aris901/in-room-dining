# Render deployment — free instance, database at Turso.
#
# The free tier has no persistent disk, so a SQLite file on the instance is
# lost on every redeploy, restart and idle spin-down. That fails the "an order
# survives a redeploy" check outright, which is why this does not try.
#
# Instead the durable copy of the database lives at Turso and the instance
# keeps an embedded replica: a local SQLite file that libsql syncs. Reads and
# writes stay local-speed, the instance needs no disk, and a cold start pulls
# the real data back down. DB_PATH therefore points at /tmp — deliberately
# throwaway, because it is a cache, not the database.
#
# Three values are not in this file because they are secrets. Set them in the
# Render dashboard (Environment → Add Secret File / Environment Variable) or
# with `sync: false` prompts at first deploy:
#
#   TURSO_SYNC_URL     libsql://<your-database>.turso.io
#   TURSO_AUTH_TOKEN   turso db tokens create <your-database>
#
# The two session secrets are generated by Render and never leave it.
#
# The free instance sleeps after ~15 minutes idle and takes roughly 40 seconds
# to wake, so HOST_SLEEPS is on: the UI then tells a visitor the demo is
# starting up rather than letting a cold start read as broken.

services:
  - type: web
    name: in-room-dining
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000

      # The embedded replica's local cache. Ephemeral on purpose.
      - key: DB_DRIVER
        value: libsql
      - key: DB_PATH
        value: /tmp/dining.db
      - key: TURSO_SYNC_URL
        sync: false          # secret — set in the dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false          # secret — set in the dashboard
      - key: TURSO_SYNC_SECONDS
        value: "60"

      - key: HOTEL_TZ
        value: Europe/Moscow
      - key: VAT_PERCENT
        value: "20"

      # Public demo settings. DEMO_MODE on exposes the demo-guest prefill,
      # which is wanted here and must be off for a real hotel.
      - key: DEMO_MODE
        value: "on"
      - key: DEMO_RESET
        value: "on"
      - key: DEMO_RESET_HOUR
        value: "4"
      - key: HOST_SLEEPS
        value: "on"
      - key: MAX_ORDERS
        value: "200"

      - key: SESSION_SECRET
        generateValue: true
      - key: STAFF_SESSION_SECRET
        generateValue: true
